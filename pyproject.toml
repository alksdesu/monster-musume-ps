[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monmusu-local-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.13,<4", "cryptography>=48,<49"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
console = ["pywebview>=6,<7"]
tools = ["requests>=2.32,<3", "UnityPy>=1.22,<2"]

[project.scripts]
monmusu-server = "monmusu_ps.app:main"
monmusu-console = "monmusu_console.app:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
monmusu_console = ["static/*", "static/views/*"]

[tool.pytest.ini_options]
pythonpath = ["server", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

